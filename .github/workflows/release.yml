name: Release

# Push a tag -> build all three platforms -> publish a GitHub Release with
# checksums. See docs/operations.md "Automated releases" for the one-time setup
# (Android keystore secrets + the API_BASE_URL repo variable).
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# workflow_dispatch builds Windows + Linux only, for a smoke test — no publish,
# no tag. Those two need just the API_BASE_URL variable. Tick "include_android"
# to also build the APK, once the keystore secrets are set up.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version string for a manual test build
        default: 0.0.0-dev
      include_android:
        description: Also build Android (needs the keystore secrets)
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.1'   # pinned — floating stable re-triggers the AGP/Kotlin/RepeatMode traps in docs/operations.md

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ github.run_number }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true"                 >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=false"                 >> "$GITHUB_OUTPUT"
          fi
      - name: Require API_BASE_URL repo variable
        run: |
          test -n "${{ vars.API_BASE_URL }}" || {
            echo "::error::Set the API_BASE_URL repository variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          }

  # Gate every build on the suite. A tag that publishes a broken binary is
  # worse than a tag that fails loudly — and nothing else runs `flutter test`.
  test:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: echo "API_BASE_URL=${{ vars.API_BASE_URL }}" > .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: [meta, test]
    if: github.event_name == 'push' || inputs.include_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: echo "API_BASE_URL=${{ vars.API_BASE_URL }}" > .env
      - run: yes | flutter doctor --android-licenses || true

      # Secrets go through env, never interpolated into the script text: GitHub
      # substitutes ${{ }} before bash parses, so an inlined password containing
      # $, ` or " would be re-expanded and silently written wrong.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties

      - run: flutter pub get
      - run: >
          flutter build apk --release
          --build-name=${{ needs.meta.outputs.version }}
          --build-number=${{ needs.meta.outputs.build_number }}

      - run: mv build/app/outputs/flutter-apk/app-release.apk AnywhereMusicPlayer-${{ needs.meta.outputs.version }}.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: AnywhereMusicPlayer-*.apk
          if-no-files-found: error

  windows:
    needs: [meta, test]
    # windows-latest ships VS 18 / MSVC 14.51 + a CMake strict enough to refuse
    # smtc_windows's tarball extraction through .plugin_symlinks, and to turn
    # permission_handler_windows's <experimental/coroutine> into a hard error.
    # Pin to the older image; see docs/operations.md.
    runs-on: windows-2022
    env:
      # permission_handler_windows still includes <experimental/coroutine>;
      # silence the STL1011 removal assertion regardless of MSVC version.
      _CL_: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v5
      - run: git config --system core.longpaths true   # docs/operations.md: MAX_PATH trap
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: Set-Content -Path .env -Value "API_BASE_URL=${{ vars.API_BASE_URL }}"

      - run: flutter pub get
      - run: >
          flutter build windows --release
          --build-name=${{ needs.meta.outputs.version }}
          --build-number=${{ needs.meta.outputs.build_number }}

      - name: Install Inno Setup 6.7.3
        # Pinned by version + SHA256. installer.iss needs 6.5.4+ (WizardStyle
        # "modern dark polar"); 7.x is an untested compiler rewrite, and the old
        # unversioned jrsoftware.org/download.php/is.exe now serves 7.x. Bump:
        # new URL from github.com/jrsoftware/issrc/releases, new Get-FileHash.
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $sha = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          curl.exe -fsSL -o is.exe $url
          if ((Get-FileHash is.exe -Algorithm SHA256).Hash -ne $sha) { throw 'Inno Setup SHA256 mismatch' }
          Start-Process -Wait -FilePath .\is.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'

      - name: Build installer
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ needs.meta.outputs.version }}
          installer.iss

      - run: Move-Item Output\AnywhereMusicPlayer_Setup.exe AnywhereMusicPlayer-${{ needs.meta.outputs.version }}-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: AnywhereMusicPlayer-*-setup.exe
          if-no-files-found: error

  linux:
    needs: [meta, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain + libmpv
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev mpv libsecret-1-dev

      - run: echo "API_BASE_URL=${{ vars.API_BASE_URL }}" > .env
      - run: flutter pub get
      - run: >
          flutter build linux --release
          --build-name=${{ needs.meta.outputs.version }}
          --build-number=${{ needs.meta.outputs.build_number }}

      # Arch package, built by wrapping the bundle above in an Arch container.
      # No Flutter needed inside it — PKGBUILD.bin has no build() step.
      - name: Arch package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          docker run --rm -e VERSION -v "$PWD:/w" -w /w archlinux:base-devel bash -c '
            set -eu
            useradd -m builder
            sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD.bin
            # Only $startdir needs to be writable by the build user — makepkg
            # keeps src/, pkg/ and the output package there, and reads the rest
            # of the tree read-only. Chowning all of /w would hand the repo root
            # to the container uid and break the mv below.
            chown -R builder /w/packaging/arch
            su builder -c "cd /w/packaging/arch && makepkg -p PKGBUILD.bin -f --nodeps"
          '
          sudo chown -R "$(id -u):$(id -g)" packaging/arch
          mv packaging/arch/*.pkg.tar.zst \
            "AnywhereMusicPlayer-${VERSION}-x86_64.pkg.tar.zst"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: AnywhereMusicPlayer-*-x86_64.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [meta, android, windows, linux]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum AnywhereMusicPlayer-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
