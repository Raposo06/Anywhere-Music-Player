name: anywhere_music_player
description: A self-hosted music streaming app for Android TV, Android, and Windows
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: any

  # State Management
  provider: any

  # HTTP Client
  http: any

  # Audio Player
  just_audio: ^0.9.40
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  # Linux links against the system's libmpv rather than bundling it (that's
  # how media_kit does Linux) — see docs/operations.md for the libmpv
  # install step this needs on the build/run machine.
  media_kit_libs_linux: ^1.2.1
  audio_service: ^0.18.12
  smtc_windows: ^0.1.3
  windows_taskbar: ^1.1.2
  # Linux media-key/session integration: audio_service has no Linux platform
  # implementation and media_kit's embedded libmpv doesn't auto-load
  # mpv-mpris (that needs mpv's user config loading, which embedded libmpv
  # disables by default) — so LinuxPresence implements the MPRIS D-Bus
  # interface directly on top of this.
  dbus: ^0.7.15

  # Permissions
  permission_handler: any

  # Crypto (MD5 for Subsonic API auth)
  crypto: any

  # Local Storage
  shared_preferences: any
  path_provider: ^2.1.0

  # Secure credential storage
  flutter_secure_storage: ^9.0.0

  # Window management (desktop title bar)
  window_manager: ^0.4.3

  # Cached network images
  cached_network_image: ^3.3.0

  # Direct access to the image disk cache (used to pre-warm covers without
  # decoding them into the in-memory image cache)
  flutter_cache_manager: any

  # Scroll-to-index for "follow the playing track" in track lists
  scrollable_positioned_list: ^0.3.8

  # Environment variables
  flutter_dotenv: ^5.2.1

  # JSON Serialization
  json_annotation: any

  # @visibleForTesting — used directly (not via flutter/foundation.dart) by
  # playback_cursor.dart, which is deliberately plain Dart with no Flutter
  # import.
  meta: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  build_runner: any
  json_serializable: any
  flutter_launcher_icons: ^0.14.4

  # Testing: fakes package-boundary platform channels (path_provider,
  # flutter_secure_storage) that `flutter test` doesn't provide a real
  # implementation for.
  path_provider_platform_interface: any
  flutter_secure_storage_platform_interface: any
  just_audio_platform_interface: any

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  windows:
    generate: true
    image_path: "assets/icons/psx.png"
  image_path: "assets/icons/psx.png"
  min_sdk_android: 21


